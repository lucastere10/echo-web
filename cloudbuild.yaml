substitutions:
  # Infra
  _AR_HOSTNAME: us-central1-docker.pkg.dev
  _DEPLOY_REGION: us-central1
  _AR_REPO: echo-images
  _SERVICE_NAME: echo-web
  _RUNTIME_SA: echo-sa
  _IMAGE: ${_AR_HOSTNAME}/${PROJECT_ID}/${_AR_REPO}/${_SERVICE_NAME}
  _CONCURRENCY: "10"
  _LABEL_APP: echo
  _LABEL_ENV: production
  _LABEL_OWNER: lucas

  # Secrets
  _SECRET_OPENAI_API_KEY: echo-openai-api-key
  _SECRET_SESSION_SECRET: echo-session-secret
  _SECRET_RESEND_API_KEY: echo-resend-api-key
  _SECRET_RESEND_FROM: echo-resend-from

  # Application
  _ADMIN_EMAIL: lucastere10@gmail.com
  _ALLOWED_EMAILS: ""
  _APP_URL: https://echo-web-399951936554.us-central1.run.app
  _MAX_FILES_PER_UPLOAD: "10"
  _INVITE_EXPIRATION_HOURS: "24"
  _MAX_FILE_SIZE_MB: "150"
  _MAX_CONCURRENT_JOBS: "2"
  _RATE_LIMIT_PER_MINUTE: "30"

steps:
  - id: Build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_IMAGE}:${COMMIT_SHA}
      - -t
      - ${_IMAGE}:latest
      - .

  - id: Push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_IMAGE}

  - id: Deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE_NAME}
      - --image=${_IMAGE}:${COMMIT_SHA}
      - --region=${_DEPLOY_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --port=8080
      - --memory=1Gi
      - --cpu=1
      - --cpu-boost
      - --concurrency=${_CONCURRENCY}
      - --timeout=300
      - --min-instances=0
      - --max-instances=5
      - --execution-environment=gen2
      - --service-account=${_RUNTIME_SA}@${PROJECT_ID}.iam.gserviceaccount.com
      - --revision-suffix=${SHORT_SHA}
      - --labels=app=${_LABEL_APP},env=${_LABEL_ENV},owner=${_LABEL_OWNER}
      - --update-env-vars=NODE_ENV=production,ADMIN_EMAIL=${_ADMIN_EMAIL},ALLOWED_EMAILS=${_ALLOWED_EMAILS},APP_URL=${_APP_URL},MAX_FILES_PER_UPLOAD=${_MAX_FILES_PER_UPLOAD},INVITE_EXPIRATION_HOURS=${_INVITE_EXPIRATION_HOURS},MAX_FILE_SIZE_MB=${_MAX_FILE_SIZE_MB},MAX_CONCURRENT_JOBS=${_MAX_CONCURRENT_JOBS},RATE_LIMIT_PER_MINUTE=${_RATE_LIMIT_PER_MINUTE}
      - --remove-env-vars=GOOGLE_CLIENT_ID
      - --remove-secrets=GOOGLE_CLIENT_SECRET
      - --set-secrets=OPENAI_API_KEY=${_SECRET_OPENAI_API_KEY}:latest,SESSION_SECRET=${_SECRET_SESSION_SECRET}:latest,RESEND_API_KEY=${_SECRET_RESEND_API_KEY}:latest,RESEND_FROM=${_SECRET_RESEND_FROM}:latest

images:
  - ${_IMAGE}:${COMMIT_SHA}
  - ${_IMAGE}:latest

options:
  logging: CLOUD_LOGGING_ONLY

serviceAccount: projects/${PROJECT_ID}/serviceAccounts/cloud-build-sa@${PROJECT_ID}.iam.gserviceaccount.com
